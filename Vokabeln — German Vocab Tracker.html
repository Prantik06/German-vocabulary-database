<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vokabeln — German Vocab Tracker</title>
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Vokabeln">
<meta name="theme-color" content="#F6F2E9">
<link rel="manifest" href="data:application/manifest+json;base64,eyJuYW1lIjoiVm9rYWJlbG4gLSBHZXJtYW4gVm9jYWIgVHJhY2tlciIsInNob3J0X25hbWUiOiJWb2thYmVsbiIsInN0YXJ0X3VybCI6Ii4iLCJkaXNwbGF5Ijoic3RhbmRhbG9uZSIsImJhY2tncm91bmRfY29sb3IiOiIjRjZGMkU5IiwidGhlbWVfY29sb3IiOiIjRjZGMkU5In0=">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Karla:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F6F2E9;
    --ink:#2B2A26;
    --ink-soft:#5A5749;
    --forest:#38513F;
    --gold:#B98A2E;
    --rule:#DAD3C2;
    --card:#FFFDF8;
    --wrong:#A8452F;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;}
  html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%;}
  body{
    height:100%;
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Karla',sans-serif;
    line-height:1.5;
  }
  .wrap{
    max-width:640px;
    margin:0 auto;
    padding:32px 20px 60px;
  }
  header{margin-bottom:28px;}
  h1{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:2.1rem;
    margin:0 0 4px;
    letter-spacing:-0.01em;
  }
  header p{margin:0;color:var(--ink-soft);font-size:0.95rem;}

  nav{
    display:flex;
    gap:2px;
    border-bottom:1px solid var(--rule);
    margin-bottom:24px;
  }
  nav button{
    font-family:'Karla',sans-serif;
    font-size:0.95rem;
    font-weight:500;
    background:none;
    border:none;
    padding:10px 4px;
    margin-right:22px;
    color:var(--ink-soft);
    cursor:pointer;
    border-bottom:2px solid transparent;
    position:relative;
    top:1px;
  }
  nav button.active{
    color:var(--forest);
    border-bottom:2px solid var(--forest);
  }

  .panel{display:none;}
  .panel.active{display:block;}

  .field{margin-bottom:14px;}
  label{display:block;font-size:0.82rem;color:var(--ink-soft);margin-bottom:4px;}
  input[type=text]{
    width:100%;
    padding:10px 12px;
    border:1px solid var(--rule);
    border-radius:4px;
    background:var(--card);
    font-family:'Karla',sans-serif;
    font-size:1rem;
    color:var(--ink);
  }
  input[type=text]:focus{outline:2px solid var(--forest);outline-offset:1px;}

  .btn{
    font-family:'Karla',sans-serif;
    font-weight:700;
    font-size:0.92rem;
    padding:10px 18px;
    border-radius:4px;
    border:1px solid var(--forest);
    background:var(--forest);
    color:#fff;
    cursor:pointer;
  }
  .btn:hover{opacity:0.92;}
  .btn.secondary{
    background:transparent;
    color:var(--forest);
  }
  .btn.ghost{
    background:transparent;
    border-color:var(--rule);
    color:var(--ink-soft);
  }
  .btn:disabled{opacity:0.5;cursor:default;}

  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}

  .word-list{list-style:none;margin:0;padding:0;}
  .word-item{
    background:var(--card);
    border:1px solid var(--rule);
    border-radius:6px;
    padding:12px 14px;
    margin-bottom:8px;
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:10px;
  }
  .word-de{font-family:'Fraunces',serif;font-weight:600;font-size:1.05rem;}
  .word-en{color:var(--ink-soft);font-size:0.92rem;margin-top:2px;}
  .word-ex{color:var(--gold);font-size:0.85rem;margin-top:4px;font-style:italic;}
  .word-ex mark.hl{
    background:rgba(185,138,46,0.22);
    color:var(--forest);
    font-style:normal;
    font-weight:700;
    padding:0 3px;
    border-radius:3px;
  }
  .del-btn{
    background:none;border:none;color:var(--ink-soft);cursor:pointer;
    font-size:0.85rem;padding:2px 6px;flex-shrink:0;
  }
  .del-btn:hover{color:var(--wrong);}

  .empty{color:var(--ink-soft);font-size:0.92rem;padding:20px 0;}

  .quiz-card{
    background:var(--card);
    border:1px solid var(--rule);
    border-radius:8px;
    padding:32px 24px;
    text-align:center;
    margin-bottom:16px;
  }
  .quiz-prompt-label{font-size:0.8rem;color:var(--ink-soft);margin-bottom:6px;}
  .quiz-word{font-family:'Fraunces',serif;font-weight:600;font-size:2rem;margin-bottom:18px;}
  .quiz-feedback{font-size:0.95rem;margin-top:14px;min-height:1.3em;}
  .quiz-feedback.correct{color:var(--forest);}
  .quiz-feedback.wrong{color:var(--wrong);}
  .quiz-answer-reveal{font-size:0.88rem;color:var(--ink-soft);margin-top:4px;}
  .quiz-score{font-size:0.85rem;color:var(--ink-soft);margin-bottom:14px;}
  .direction-toggle{margin-bottom:14px;font-size:0.85rem;color:var(--ink-soft);}
  .direction-toggle button{
    background:none;border:1px solid var(--rule);border-radius:4px;
    padding:5px 10px;font-size:0.82rem;cursor:pointer;color:var(--ink-soft);
    margin-left:6px;font-family:'Karla',sans-serif;
  }
  .direction-toggle button.active{border-color:var(--forest);color:var(--forest);}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Vokabeln</h1>
    <p>Log new German words as you meet them, then test yourself later.</p>
  </header>

  <nav>
    <button data-panel="add" class="active">Add word</button>
    <button data-panel="list">My words (<span id="countTag">0</span>)</button>
    <button data-panel="quiz">Quiz me</button>
  </nav>

  <section id="panel-add" class="panel active">
    <div class="field">
      <label for="inpWord">German word (with article, e.g. "der Tisch")</label>
      <input type="text" id="inpWord" placeholder="die Wohnung">
    </div>
    <div class="field">
      <label for="inpMeaning">Meaning</label>
      <input type="text" id="inpMeaning" placeholder="the apartment">
    </div>
    <div class="field">
      <label for="inpExample">Example sentence (optional)</label>
      <input type="text" id="inpExample" placeholder="Meine Wohnung ist klein.">
    </div>
    <button class="btn" id="btnAdd">Save word</button>
    <p id="addStatus" style="color:var(--forest);font-size:0.85rem;margin-top:10px;"></p>
  </section>

  <section id="panel-list" class="panel">
    <p style="font-family:'Fraunces',serif;font-weight:600;font-size:1.1rem;margin:0 0 14px;">
      <span id="countTagBig">0</span> word<span id="countTagPlural">s</span> saved
    </p>
    <div class="row" style="margin-bottom:16px;">
      <button class="btn secondary" id="btnExport">Export words (.json)</button>
      <button class="btn ghost" id="btnImportTrigger">Import from file</button>
      <input type="file" id="fileImport" accept="application/json" style="display:none;">
    </div>
    <p id="syncNote" style="color:var(--ink-soft);font-size:0.82rem;margin:-8px 0 16px;">Export on one device, then import that file on another to bring your list up to date. Words save automatically on this device as you go.</p>
    <div id="listStatus" class="empty">Loading…</div>
    <ul class="word-list" id="wordList"></ul>
  </section>

  <section id="panel-quiz" class="panel">
    <div class="direction-toggle">
      Quiz direction:
      <button id="dirDeEn" class="active">DE → EN</button>
      <button id="dirEnDe">EN → DE</button>
    </div>
    <div id="quizArea"></div>
  </section>
</div>

<script>
const STORE_KEY = 'vocab-words';
let words = [];
let quizDirection = 'deen';
let quizPool = [];
let quizIndex = 0;
let quizScore = {right:0, wrong:0};
let currentAnswerRevealed = false;

function loadWords(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    words = raw ? JSON.parse(raw) : [];
  }catch(e){
    words = [];
  }
  renderList();
  updateCountTag();
}

function saveWords(){
  try{
    localStorage.setItem(STORE_KEY, JSON.stringify(words));
  }catch(e){
    console.error('Storage error', e);
  }
}

let downloadsCap = null;
(async () => {
  try{
    if(window.claude && typeof window.claude.use === 'function'){
      downloadsCap = await window.claude.use('downloads');
    }
  }catch(e){ downloadsCap = null; }
})();

document.getElementById('btnExport').addEventListener('click', async () => {
  const payload = JSON.stringify(words, null, 2);
  const filename = 'vokabeln-backup.json';
  if(downloadsCap){
    try{
      await downloadsCap.save({filename, data: payload});
      return;
    }catch(e){
      // fall through to plain browser download
    }
  }
  const blob = new Blob([payload], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
});

document.getElementById('btnImportTrigger').addEventListener('click', () => {
  document.getElementById('fileImport').click();
});

document.getElementById('fileImport').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if(!file) return;
  try{
    const text = await file.text();
    const incoming = JSON.parse(text);
    if(!Array.isArray(incoming)) throw new Error('bad format');
    let added = 0, skipped = 0;
    incoming.forEach(w => {
      if(w && w.word && w.meaning){
        if(findDuplicate(w.word)){ skipped++; return; }
        words.push({id: Date.now()+Math.random(), word: w.word, meaning: w.meaning, example: w.example || '', correct: w.correct||0, wrong: w.wrong||0});
        added++;
      }
    });
    saveWords();
    renderList();
    updateCountTag();
    const status = document.getElementById('listStatus');
    status.style.display = 'block';
    status.textContent = `Imported ${added} new word${added===1?'':'s'}${skipped ? ` (${skipped} duplicate${skipped===1?'':'s'} skipped)` : ''}.`;
    setTimeout(renderList, 2000);
  }catch(err){
    alert('Could not read that file — make sure it\'s a Vokabeln export.');
  }
  e.target.value = '';
});

function updateCountTag(){
  document.getElementById('countTag').textContent = words.length;
  const bigTag = document.getElementById('countTagBig');
  const pluralTag = document.getElementById('countTagPlural');
  if(bigTag){
    bigTag.textContent = words.length;
    pluralTag.textContent = words.length === 1 ? '' : 's';
  }
}

function normalize(str){
  return str.trim().toLowerCase().replace(/^(der|die|das)\s+/, '');
}

function findDuplicate(wordText){
  const target = normalize(wordText);
  return words.find(w => normalize(w.word) === target);
}

function renderList(){
  const listEl = document.getElementById('wordList');
  const statusEl = document.getElementById('listStatus');
  listEl.innerHTML = '';
  if(words.length === 0){
    statusEl.style.display = 'block';
    statusEl.textContent = 'No words yet — add your first one from the "Add word" tab.';
    return;
  }
  statusEl.style.display = 'none';
  [...words].reverse().forEach(w => {
    const li = document.createElement('li');
    li.className = 'word-item';
    li.innerHTML = `
      <div>
        <div class="word-de">${escapeHtml(w.word)}</div>
        <div class="word-en">${escapeHtml(w.meaning)}</div>
        ${w.example ? `<div class="word-ex">${highlightExample(w.example, w.word)}</div>` : ''}
      </div>
      <button class="del-btn" data-id="${w.id}" title="Delete">Delete</button>
    `;
    listEl.appendChild(li);
  });
  listEl.querySelectorAll('.del-btn').forEach(btn => {
    btn.addEventListener('click', () => deleteWord(btn.dataset.id));
  });
}

function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

function escapeRegExp(str){
  return str.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
}

function highlightExample(example, word){
  const escaped = escapeHtml(example);
  const core = normalize(word); // strips der/die/das, lowercases
  if(!core) return escaped;
  // Match the core word plus any trailing letters (covers simple German
  // inflections like Tisch -> Tische, Tisches) while staying HTML-safe.
  const regex = new RegExp('(' + escapeRegExp(core) + "[a-zA-ZäöüÄÖÜß]*)", 'gi');
  return escaped.replace(regex, '<mark class="hl">$1</mark>');
}

async function deleteWord(id){
  words = words.filter(w => String(w.id) !== String(id));
  await saveWords();
  renderList();
  updateCountTag();
}

document.getElementById('btnAdd').addEventListener('click', async () => {
  const wordEl = document.getElementById('inpWord');
  const meaningEl = document.getElementById('inpMeaning');
  const exampleEl = document.getElementById('inpExample');
  const status = document.getElementById('addStatus');
  const word = wordEl.value.trim();
  const meaning = meaningEl.value.trim();
  const example = exampleEl.value.trim();
  if(!word || !meaning){
    status.style.color = 'var(--wrong)';
    status.textContent = 'Enter both the word and its meaning.';
    return;
  }
  const dup = findDuplicate(word);
  if(dup){
    status.style.color = 'var(--wrong)';
    status.textContent = `"${dup.word}" is already in your list (means "${dup.meaning}").`;
    return;
  }
  words.push({id: Date.now(), word, meaning, example, correct:0, wrong:0});
  await saveWords();
  updateCountTag();
  wordEl.value = ''; meaningEl.value = ''; exampleEl.value = '';
  status.style.color = 'var(--forest)';
  status.textContent = `Saved "${word}".`;
  wordEl.focus();
  setTimeout(() => { status.textContent=''; }, 2500);
});

// Tab navigation
document.querySelectorAll('nav button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('panel-' + btn.dataset.panel).classList.add('active');
    if(btn.dataset.panel === 'quiz') startQuiz();
    if(btn.dataset.panel === 'list') renderList();
  });
});

document.getElementById('dirDeEn').addEventListener('click', () => setDirection('deen'));
document.getElementById('dirEnDe').addEventListener('click', () => setDirection('ende'));

function setDirection(dir){
  quizDirection = dir;
  document.getElementById('dirDeEn').classList.toggle('active', dir==='deen');
  document.getElementById('dirEnDe').classList.toggle('active', dir==='ende');
  startQuiz();
}

function startQuiz(){
  quizScore = {right:0, wrong:0};
  quizPool = shuffle([...words]);
  quizIndex = 0;
  renderQuiz();
}

function shuffle(arr){
  for(let i = arr.length -1; i>0; i--){
    const j = Math.floor(Math.random()*(i+1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function renderQuiz(){
  const area = document.getElementById('quizArea');
  if(words.length === 0){
    area.innerHTML = `<p class="empty">Add a few words first, then come back to quiz yourself.</p>`;
    return;
  }
  if(quizIndex >= quizPool.length){
    area.innerHTML = `
      <div class="quiz-card">
        <div class="quiz-prompt-label">Round complete</div>
        <div class="quiz-word" style="font-size:1.4rem;">${quizScore.right} / ${quizScore.right + quizScore.wrong} correct</div>
        <button class="btn" id="btnRestart">Quiz again</button>
      </div>`;
    document.getElementById('btnRestart').addEventListener('click', startQuiz);
    return;
  }
  const w = quizPool[quizIndex];
  const prompt = quizDirection === 'deen' ? w.word : w.meaning;
  const promptLabel = quizDirection === 'deen' ? 'What does this mean?' : 'How do you say this in German?';
  currentAnswerRevealed = false;
  area.innerHTML = `
    <div class="quiz-score">Score: ${quizScore.right} right · ${quizScore.wrong} wrong · Card ${quizIndex+1} of ${quizPool.length}</div>
    <div class="quiz-card">
      <div class="quiz-prompt-label">${promptLabel}</div>
      <div class="quiz-word">${escapeHtml(prompt)}</div>
      <div class="field" style="max-width:320px;margin:0 auto 12px;">
        <input type="text" id="quizAnswer" autocomplete="off" placeholder="Type your answer">
      </div>
      <div class="row" style="justify-content:center;">
        <button class="btn" id="btnCheck">Check</button>
        <button class="btn ghost" id="btnSkip">Skip</button>
      </div>
      <div class="quiz-feedback" id="quizFeedback"></div>
    </div>
  `;
  const input = document.getElementById('quizAnswer');
  input.focus();
  input.addEventListener('keydown', e => { if(e.key === 'Enter') checkAnswer(); });
  document.getElementById('btnCheck').addEventListener('click', checkAnswer);
  document.getElementById('btnSkip').addEventListener('click', () => nextCard());

  function checkAnswer(){
    if(currentAnswerRevealed){ nextCard(); return; }
    currentAnswerRevealed = true;
    const given = input.value.trim().toLowerCase();
    const correctAnswer = quizDirection === 'deen' ? w.meaning : w.word;
    const normalizedCorrect = correctAnswer.trim().toLowerCase();
    const isRight = given.length > 0 && (given === normalizedCorrect || normalizedCorrect.includes(given) && given.length > 2);
    const feedback = document.getElementById('quizFeedback');
    if(isRight){
      quizScore.right++;
      feedback.className = 'quiz-feedback correct';
      feedback.textContent = 'Correct!';
    } else {
      quizScore.wrong++;
      feedback.className = 'quiz-feedback wrong';
      feedback.innerHTML = `Not quite. <div class="quiz-answer-reveal">Answer: ${escapeHtml(correctAnswer)}</div>`;
    }
    document.getElementById('btnCheck').textContent = 'Next';
  }
  function nextCard(){
    quizIndex++;
    renderQuiz();
  }
}

loadWords();
</script>
</body>
</html>
